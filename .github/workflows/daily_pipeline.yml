name: DryBrief — Tägliche Datenpipeline

on:
  schedule:
    # Täglich um 07:00 UTC (09:00 MESZ) — nach dem wöchentlichen BAFU-Update
    - cron: "0 7 * * *"
  workflow_dispatch:
    # Manueller Start über GitHub UI möglich
    inputs:
      rebuild_lookups:
        description: "Lookups neu aufbauen (einmalig, ~5 min)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ── Job 1: Lookups (nur wenn explizit angefordert) ──────────────────────────
  build-lookups:
    name: Lookup-Builder (einmalig)
    runs-on: ubuntu-latest
    if: github.event.inputs.rebuild_lookups == 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Lookup-Builder ausführen
        run: python pipeline/01_build_lookups.py

      - name: Lookups committen
        run: |
          git config user.name  "DryBrief Bot"
          git config user.email "bling-eel-matchbox@duck.com"
          git add data/lookups/
          git diff --staged --quiet || git commit -m "chore: Lookups aktualisiert [skip ci]"
          git push

  # ── Job 2: Tägliche Briefing-Generierung ────────────────────────────────────
  update-briefings:
    name: Briefings aktualisieren
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install pandas requests

      - name: Daten abrufen
        run: python pipeline/02_fetch_data.py

      - name: Briefings generieren
        run: python pipeline/03_generate_briefings.py

      - name: Briefings committen und deployen
        run: |
          git config user.name  "DryBrief Bot"
          git config user.email "bling-eel-matchbox@duck.com"
          git add data/briefings/ data/raw/
          git diff --staged --quiet && echo "Keine Änderungen." && exit 0
          git commit -m "data: Trockenheitsbriefings $(date -u +%Y-%m-%d)"
          git push

  # ── Job 3: GitHub Pages Deployment ─────────────────────────────────────────
  deploy-pages:
    name: GitHub Pages deployen
    runs-on: ubuntu-latest
    needs: update-briefings
    if: always()

    permissions:
      contents: read
      pages:    write
      id-token: write

    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # immer den neuesten Stand holen

      - name: Pages-Artefakt vorbereiten
        # Frontend + Daten in eine Deploy-Struktur kopieren
        run: |
          mkdir -p _site
          cp -r frontend/* _site/
          cp -r data/      _site/data/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
